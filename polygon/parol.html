<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Полигон — Вход</title>
<link rel="stylesheet" href="stil.css"></head>
<body>
<header><b>Полигон</b><input id="poisk" type="text" aria-label="Поиск по сайту" placeholder="Поиск"></header>
<main>
<h1>Вход</h1>
<form id="forma" hidden onsubmit="return false">
  <label>Логин <input id="login" type="text" aria-label="Логин"></label>
  <label>Пароль <input id="parol" type="password" aria-label="Пароль"></label>
  <button type="button" id="vojti">Войти</button>
</form>
<label>Контроль <textarea id="kontrol" readonly aria-label="Контроль пароля" rows="1">0</textarea></label>
</main>
<script src="pomehi.js"></script>
<script>
(function () {
  // here the focus disturbance moves focus into the password field
  P.kudaFokus = function () { return document.getElementById('parol'); };
  document.addEventListener('input', function () {
    var p = document.getElementById('parol');
    document.getElementById('kontrol').value = String(p ? p.value.length : 0);
  });
  P.pokazatPozzhe(document.getElementById('forma'), 200, 1500);
})();
</script>
</body></html>
