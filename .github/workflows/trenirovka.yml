name: trenirovka-ruk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  gigiena:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: public hygiene check
        shell: pwsh
        run: ./ci/proverka-gigieny.ps1

  smoke:
    needs: gigiena
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: fast smoke, one run of each page, fails only if the harness is broken
        shell: powershell
        run: ./ci/progon.ps1 -Seed 0 -Progonov 4 -Vyhod "smoke-0.json" -Strogo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-0
          path: smoke-0.json
          if-no-files-found: warn

  trenirovka:
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: runs of the skill
        shell: powershell
        run: ./ci/progon.ps1 -Seed ${{ matrix.seed }} -Progonov 8 -Vyhod "rezultat-${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rezultat-${{ matrix.seed }}
          path: rezultat-${{ matrix.seed }}.json
          if-no-files-found: warn

  svod:
    needs: [smoke, trenirovka]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rezultat-*
          path: rez
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          path: smoke
          merge-multiple: true
      - name: runner minutes of the matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > jobs.json || echo '{}' > jobs.json
      - name: aggregate
        run: python3 ci/svod.py rez out jobs.json smoke
      - name: publish to branch itog
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan itog-tmp && git rm -rf . -q
          cp out/itog.json out/itog.md . && git add itog.json itog.md
          git commit -qm "itog run $GITHUB_RUN_ID sha $GITHUB_SHA"
          git push -f origin HEAD:itog
